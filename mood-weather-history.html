<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>こころ天気 — 過去の記録</title>
<style>
:root{--ink:#172E4B;--muted:#7C8794;--page:#F2F3F5;--line:#E8EAED;--yellow:#FFE45B}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.app{max-width:900px;margin:auto;padding:30px 22px 56px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:20px;font-weight:900}.nav{display:flex;gap:8px}.nav a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:9px;font-size:13px;font-weight:700}.nav a.active{background:#fff;color:var(--ink)}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}.kicker{font-size:11px;letter-spacing:.12em;color:#9AA2AA;font-weight:800}.title{font-size:27px;margin:5px 0 2px;font-weight:900}.intro{margin:0 0 18px;color:var(--muted);font-size:13px}.privacy{padding:12px 14px;background:#F5F6F7;border-radius:9px;color:#687587;font-size:12px;margin-bottom:18px}.list{display:grid;gap:12px}.entry{border:1px solid var(--line);border-radius:11px;padding:16px}.entry-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.date{font-weight:800}.mode{font-size:11px;color:var(--muted);background:#F1F2F4;padding:4px 8px;border-radius:7px}.weather-row{display:flex;flex-wrap:wrap;gap:9px}.weather{padding:8px 12px;border-radius:9px;background:var(--weather-color);font-weight:800;font-size:12px}.weather.dark{color:#fff}.comment,.memo{margin:12px 0 0;color:#586575;font-size:13px}.memo{padding:10px 12px;border-radius:8px;background:#F5F6F7;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:42px 18px;text-align:center;color:var(--muted);background:#F8F9FA;border-radius:10px}.back{display:inline-flex;margin-top:18px;padding:9px 14px;border-radius:9px;background:var(--yellow);color:var(--ink);text-decoration:none;font-weight:800;font-size:12px}@media(max-width:600px){.app{padding:20px 14px 40px}.card{padding:18px}.brand{font-size:18px}.nav a{padding:7px 8px;font-size:11px}.title{font-size:24px}.entry{padding:13px}}
</style></head><body><main class="app"><header class="top"><div class="brand">こころ天気</div><nav class="nav"><a href="mood-weather-sharing.html">今日の記録</a><a class="active" href="mood-weather-history.html">過去の記録</a><a href="mood-weather-share.html">共有設定</a></nav></header><section class="card"><div class="kicker">MY WEATHER</div><h1 class="title">過去の記録</h1><p class="intro">これまでに記録した心の天気を見返せます。</p><div class="privacy">記録とメモは、このブラウザーに保存された自分のデータです。他の人には共有されません。</div><div class="list" id="list"></div><a class="back" href="mood-weather-sharing.html">今日の記録へ</a></section></main>
<script>
const key="kokoro-weather-records-v1",labels={sunny:"快晴",partly:"晴れ",cloudy:"くもり",drizzle:"小雨",storm:"豪雨"},colors={sunny:"#2CC8E8",partly:"#22B9F4",cloudy:"#26BDF1",drizzle:"#1749B4",storm:"#064779"},days=["日","月","火","水","木","金","土"],list=document.getElementById("list");let records={};try{records=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}const keys=Object.keys(records).sort().reverse();if(!keys.length){list.innerHTML='<div class="empty">まだ記録がありません。今日の天気を記録すると、ここに並びます。</div>'}keys.forEach(function(k){const r=records[k],p=k.split("-"),d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]),12),entry=document.createElement("article");entry.className="entry";const head=document.createElement("div");head.className="entry-head";const date=document.createElement("time");date.className="date";date.textContent=p[0]+"年"+Number(p[1])+"月"+Number(p[2])+"日（"+days[d.getDay()]+"）";const mode=document.createElement("span");mode.className="mode";mode.textContent=r.mode==="parts"?"午前／午後":"1日通し";head.append(date,mode);entry.append(head);const row=document.createElement("div");row.className="weather-row";function add(id,part){if(!id)return;const b=document.createElement("span");b.className="weather"+(id==="drizzle"||id==="storm"?" dark":"");b.style.setProperty("--weather-color",colors[id]);b.textContent=(part?part+"　":"")+(labels[id]||id);row.appendChild(b)}if(r.mode==="parts"){add(r.morning,"午前");add(r.afternoon,"午後")}else add(r.weather,"");entry.appendChild(row);if(r.comment){const c=document.createElement("p");c.className="comment";c.textContent="クモネズミ："+r.comment;entry.appendChild(c)}if(r.memo){const m=document.createElement("div");m.className="memo";m.textContent=r.memo;entry.appendChild(m)}list.appendChild(entry)});
</script></body></html>
