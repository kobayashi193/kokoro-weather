const STORAGE_KEY = "kokoro-weather-records-v1";
const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
const today = new Date();
const dateKey = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
const todayKey = dateKey(today);
document.getElementById("today-date").textContent = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日（${weekdays[today.getDay()]}）`;
const toast = (message) => {
  const node = document.getElementById("toast");
  node.textContent = message;
  node.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => node.classList.remove("show"), 2300);
};
let records = {};
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  if (saved && typeof saved === "object" && !Array.isArray(saved)) records = saved;
} catch (_) {
  toast("このブラウザでは保存データを読み込めませんでした。");
}
function persistRecords() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}
const iconPath = (id) => weatherTypes.find((item) => item.id === id)?.icon || "";
const all = document.getElementById("all-weather");
const periods = document.getElementById("period-weather");
function makeChoice(weather, group) {
  const button = document.createElement("button");
  button.className = "weather-choice";
  button.type = "button";
  button.dataset.weather = weather.id;
  button.dataset.group = group;
  button.setAttribute("aria-label", weather.label);
  button.innerHTML = `<img alt="" src="${iconPath(weather.id)}"><span>${weather.label}</span>`;
  button.addEventListener("click", () => {
    document.querySelectorAll(`.weather-choice[data-group="${group}"]`).forEach((choice) => choice.classList.remove("active"));
    button.classList.add("active");
    button.parentElement.classList.add("has-selection");
    updateCharacterLine();
  });
  return button;
}
weatherTypes.forEach((weather) => all.appendChild(makeChoice(weather, "all")));
["午前", "午後"].forEach((part) => {
  const row = document.createElement("div");
  row.className = "period-row";
  row.innerHTML = `<span class="period-name">${part}</span>`;
  const grid = document.createElement("div");
  grid.className = "weather-grid";
  grid.style.gridTemplateColumns = "repeat(5,minmax(0,1fr))";
  weatherTypes.forEach((weather) => grid.appendChild(makeChoice(weather, part)));
  row.appendChild(grid);
  periods.appendChild(row);
});
function setMode(mode) {
  document.querySelectorAll(".modes button").forEach((button) => {
    const selected = button.dataset.mode === mode;
    button.classList.toggle("active", selected);
    button.setAttribute("aria-selected", String(selected));
  });
  all.hidden = mode === "parts";
  periods.hidden = mode !== "parts";
}
document.querySelectorAll(".modes button").forEach((button) => button.addEventListener("click", () => {
  setMode(button.dataset.mode);
  updateCharacterLine();
}));
const comments = {
  initial: [
    "何でも、毎日続けるのって大変ハリ〜",
    "今日も来たのえらいハリ。記録はさくっとハリね。",
    "続けるって、だいたい忘れるところから始まるハリ。"
  ],
  sunny: [
    "こんな日が毎日続けばいいハリね。",
    "晴れの気分、今日は十分味わうハリ。",
    "太陽もびっくりするぐらい明るいハリね。"
  ],
  partly: [
    "特別なことがなくても、何だか晴れやかな日ってあるハリよね。",
    "何だか楽しそうハリね。",
    "心が晴れてるの、いいハリね。理由は聞かないハリ。"
  ],
  cloudy: ["凪。", "くもり。気持ちも保留でいいハリ。", "曖昧なままでいいこともあるハリね。"],
  drizzle: [
    "理由はなくても、何となく小雨の時ってあるハリよね。",
    "言葉にするほどじゃない気分もあるハリ。",
    "心の小雨、今日はそのまま記録ハリ。"
  ],
  storm: [
    "励まされても、素直に受け取れない時もあるハリよね。",
    "気持ちが荒れてると、何もかもが辛く感じるハリ。",
    "正直に「豪雨」を選択することも、強さのひとつハリね。"
  ],
  gap: [
    "楽しいことと辛いことは、いつも交互にくるハリよね。",
    "気持ちの高低差で、風邪ひかないようにするハリ！",
    "1日でいろんなことがあるのが、生活ハリね。"
  ]
};
const weatherLevel = {sunny:0, partly:1, cloudy:2, drizzle:3, storm:4};
function chooseComment(category) {
  const options = comments[category] || comments.initial;
  return options[Math.floor(Math.random() * options.length)];
}
const characterLine = document.getElementById("character-line");
function selectedWeatherIds() {
  const mode = document.querySelector(".modes button.active")?.dataset.mode || "all";
  if (mode === "all") return [all.querySelector(".weather-choice.active")?.dataset.weather].filter(Boolean);
  return ["午前", "午後"].map((part) => periods.querySelector(`.weather-choice[data-group="${part}"].active`)?.dataset.weather).filter(Boolean);
}
function updateCharacterLine(ids = selectedWeatherIds()) {
  if (ids.length > 1 && Math.abs(weatherLevel[ids[0]] - weatherLevel[ids[1]]) >= 2) {
    characterLine.textContent = chooseComment("gap");
    return;
  }
  characterLine.textContent = chooseComment(ids.length ? ids[ids.length - 1] : "initial");
}
const historyColors = {sunny:"#2CC8E8", partly:"#22B9F4", cloudy:"#26BDF1", drizzle:"#1749B4", storm:"#064779"};
function formatDay(date) {
  return `${date.getDate()}日（${weekdays[date.getDay()]}）`;
}
function renderHistory() {
  const root = document.getElementById("history-grid");
  root.replaceChildren();
  const base = new Date();
  base.setHours(12, 0, 0, 0);
  for (let offset = 0; offset < 7; offset++) {
    const date = new Date(base);
    date.setDate(base.getDate() - offset);
    const record = records[dateKey(date)];
    const first = record?.mode === "parts" ? record.morning : record?.weather;
    const second = record?.mode === "parts" ? record.afternoon : null;
    const cell = document.createElement("div");
    cell.className = `history-day${first ? ` ${first}` : " empty"}`;
    const dateLabel = document.createElement("span");
    dateLabel.className = "date";
    dateLabel.textContent = formatDay(date);
    cell.appendChild(dateLabel);
    if (!first) {
      const empty = document.createElement("span");
      empty.className = "empty-mark";
      empty.textContent = "—";
      cell.appendChild(empty);
    } else {
      const icons = document.createElement("span");
      icons.className = second ? "history-icons" : "history-icon-single";
      [first, second].filter(Boolean).forEach((id) => {
        const image = document.createElement("img");
        image.alt = weatherTypes.find((weather) => weather.id === id)?.label || "";
        image.src = iconPath(id);
        icons.appendChild(image);
      });
      cell.appendChild(icons);
      if (second) cell.style.backgroundImage = `linear-gradient(135deg, ${historyColors[first]} 0 49%, ${historyColors[second]} 51% 100%)`;
      if (record.memo) cell.title = record.memo;
    }
    root.appendChild(cell);
  }
}
function selectChoice(group, id) {
  const button = document.querySelector(`.weather-choice[data-group="${group}"][data-weather="${id}"]`);
  if (!button) return;
  document.querySelectorAll(`.weather-choice[data-group="${group}"]`).forEach((choice) => choice.classList.remove("active"));
  button.classList.add("active");
  button.parentElement.classList.add("has-selection");
}
function loadToday() {
  const record = records[todayKey];
  if (!record) return;
  setMode(record.mode || "all");
  document.querySelector(".memo").value = record.memo || "";
  if (record.mode === "parts") {
    selectChoice("午前", record.morning);
    selectChoice("午後", record.afternoon);
    updateCharacterLine([record.morning, record.afternoon].filter(Boolean));
  } else {
    selectChoice("all", record.weather);
    updateCharacterLine(record.weather ? [record.weather] : []);
  }
  if (record.comment && record.commentVersion === 2) characterLine.textContent = record.comment;
}
document.getElementById("save").addEventListener("click", () => {
  const mode = document.querySelector(".modes button.active")?.dataset.mode || "all";
  const memo = document.querySelector(".memo").value.trim();
  let record;
  if (mode === "all") {
    const weather = all.querySelector(".weather-choice.active")?.dataset.weather;
    if (!weather) return toast("天気をひとつ選んでね。");
    record = {mode, weather, memo};
  } else {
    const morning = periods.querySelector('.weather-choice[data-group="午前"].active')?.dataset.weather;
    const afternoon = periods.querySelector('.weather-choice[data-group="午後"].active')?.dataset.weather;
    if (!morning || !afternoon) return toast("午前と午後、それぞれ選んでね。");
    record = {mode, morning, afternoon, memo};
  }
  record.comment = characterLine.textContent;
  record.commentVersion = 2;
  records[todayKey] = record;
  try {
    persistRecords();
    renderHistory();
    toast("今日の記録を保存したよ。");
  } catch (_) {
    toast("保存できませんでした。このブラウザの保存設定を確認してね。");
  }
});
renderHistory();
loadToday();
if (!records[todayKey]) updateCharacterLine([]);
</script></body></html>
