<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>こころ天気 — 共有設定</title>
<style>
:root{--ink:#172E4B;--muted:#7C8794;--page:#F2F3F5;--line:#E8EAED;--cyan:#29C3DC;--yellow:#FFE45B;--blue:#214E95;--soft:#F5F6F7}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:14px;line-height:1.6}.app{max-width:850px;margin:0 auto;padding:30px 24px 56px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:20px;font-weight:900;letter-spacing:.04em;color:inherit;text-decoration:none}.nav{display:flex;gap:8px}.nav a{color:#7A8490;text-decoration:none;padding:8px 13px;border-radius:9px;font-size:13px;font-weight:700}.nav a.active{color:var(--ink);background:white}.card{background:#fff;border:1px solid #E9EAEC;border-radius:12px;padding:25px}.kicker{font-size:11px;letter-spacing:.12em;color:#9AA2AA;font-weight:800}.title{font-size:25px;margin:4px 0 2px;font-weight:900}.intro{font-size:13px;color:#7D8790;margin:0 0 22px}.privacy{display:flex;gap:10px;align-items:center;background:#F5F6F7;border-radius:10px;padding:12px 14px;color:#737D88;font-size:12px;margin-bottom:17px}.privacy-mark{width:8px;height:8px;border-radius:50%;background:#5BAEB9}.people{display:grid;gap:10px}.person{display:grid;grid-template-columns:42px minmax(120px,1fr) minmax(155px,auto) 34px;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:10px}.avatar{width:38px;height:38px;display:grid;place-items:center;background:#E8F5F6;border-radius:50%;font-weight:900;color:#286B79}.details strong{display:block;font-size:13px;font-weight:800}.details small{font-size:11px;color:#8B949D}.scope{display:flex;align-items:center;gap:8px;font-size:11px;color:#737D88}.scope select{font:inherit;color:#465769;background:#F1F2F3;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}.remove{border:0;background:transparent;color:#9AA2AA;font-size:19px;cursor:pointer}.invite{display:block;margin-top:13px;padding:11px 14px;border:1px solid #DCE1E5;background:#fff;border-radius:9px;color:#657584;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.help{font-size:11px;color:#87919B;margin:17px 0 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172E4B;color:white;padding:10px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}.modal-bg{position:fixed;inset:0;background:#172E4B66;display:none;place-items:center;padding:18px}.modal-bg.show{display:grid}.modal{width:min(390px,100%);padding:23px;border-radius:12px;background:white}.modal h2{font-size:18px;margin:0 0 5px}.modal p{margin:0 0 15px;color:#7D8790;font-size:12px}.modal input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.actions button{border:0;border-radius:8px;background:#F1F2F3;color:#526170;padding:9px 13px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.actions .primary{background:var(--yellow);color:var(--ink)}@media(max-width:620px){.app{padding:20px 14px}.top{align-items:flex-start}.nav a{padding:7px 8px;font-size:11px}.card{padding:18px}.person{grid-template-columns:38px minmax(85px,1fr) 34px;gap:8px}.scope{grid-column:2;grid-row:2}.remove{grid-column:3;grid-row:1}.avatar{grid-row:1/3}.title{font-size:22px}}
.brand{font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Yu Gothic",sans-serif;letter-spacing:.04em} .brand{-webkit-text-stroke:.65px currentColor}.nav a.active{background:#1749B4;color:#fff}.kicker{color:#168FA6}.privacy{background:#DDF6FA;color:#315568}.privacy-mark{background:#22B9F4}.person{border-color:#B8E8F0}.avatar{background:#22B9F4;color:#17324B}.scope select{background:#E6F6FA;color:#17324B}.invite{background:#FFE45B;border-color:#FFE45B;color:#172E4B}.invite:hover{filter:brightness(.98)}</style></head><body><main class="app"><header class="top"><a class="brand" href="index.html">こころ天気</a><nav class="nav"><a href="mood-weather-sharing.html">今日の記録</a><a href="mood-weather-history.html">過去の記録</a><a class="active" href="mood-weather-share.html">共有設定</a><a href="mood-weather-guide.html">使い方</a></nav></header><section class="card"><div class="kicker">SHARING</div><h1 class="title">共有設定</h1><p class="intro">選んだ人に、自分の天気を共有しよう！</p><div class="privacy"><span>共有相手に見えるのは天気とクモネズミのひとことだけ。メモは共有されません。</span></div><div class="people" id="people"><div class="person"><div class="avatar">さ</div><div class="details"><strong>さくら</strong><small>sakura@example.com</small></div><label class="scope">見せる期間<select><option value="from_today">今日から</option><option value="past_7_days">過去7日</option><option value="past_30_days" selected>過去30日</option><option value="all_past">すべての過去</option></select></label><button class="remove" aria-label="さくらとの共有を解除">×</button></div><div class="person"><div class="avatar">た</div><div class="details"><strong>たくみ</strong><small>takumi@example.com</small></div><label class="scope">見せる期間<select><option value="from_today">今日から</option><option value="past_7_days">過去7日</option><option value="past_30_days">過去30日</option><option value="all_past" selected>すべての過去</option></select></label><button class="remove" aria-label="たくみとの共有を解除">×</button></div></div><button class="invite" id="invite">＋　共有する人を追加</button><p class="help">「今日から」は共有を設定した日以降の記録が対象です。共有はいつでも解除できます。</p></section></main><div class="toast" id="toast"></div><div class="modal-bg" id="modal"><div class="modal"><h2>共有する人を追加</h2><p>招待した相手が見られる期間を選べます。「今日から」は共有を設定した日以降が対象です。</p><input id="email" type="email" placeholder="メールアドレス"><div class="actions"><button id="cancel">キャンセル</button><button class="primary" id="send">招待する</button></div></div></div><script>
const toast=s=>{let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2100)};document.querySelectorAll(".remove").forEach(b=>b.onclick=()=>{b.closest(".person").remove();toast("共有を解除しました")});const modal=document.getElementById("modal");document.getElementById("invite").onclick=()=>modal.classList.add("show");document.getElementById("cancel").onclick=()=>modal.classList.remove("show");document.getElementById("send").onclick=()=>{let input=document.getElementById("email"),email=input.value.trim();if(!email||!email.includes("@")){input.focus();return}let person=document.createElement("div");person.className="person";person.innerHTML='<div class="avatar"></div><div class="details"><strong></strong><small></small></div><label class="scope">見せる期間<select><option value="from_today">今日から</option><option value="past_7_days">過去7日</option><option value="past_30_days" selected>過去30日</option><option value="all_past">すべての過去</option></select></label><button class="remove" aria-label="共有を解除">×</button>';person.querySelector(".avatar").textContent=email.slice(0,1).toUpperCase();person.querySelector("strong").textContent=email.split("@")[0];person.querySelector("small").textContent=email;person.querySelector(".remove").onclick=()=>{person.remove();toast("共有を解除しました")};document.getElementById("people").appendChild(person);input.value="";modal.classList.remove("show");toast("招待を作成しました")};
</script></body></html>
<script>document.addEventListener('DOMContentLoaded',()=>{const note=document.querySelector('.privacy span');if(note)note.textContent='共有相手に見えるのは天気だけ。メモは共有されません。';});</script>
